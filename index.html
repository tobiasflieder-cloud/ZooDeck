<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12301f">
<meta name="description" content="Zoodeck: Baue deinen Zoo, Karte für Karte.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zoodeck">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}html,body{margin:0}body{font:14px system-ui,sans-serif;-webkit-touch-callout:none;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Zoodeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400;500;600&display=swap">
<style>
/* Layout: one screen, no scrolling. Phone: stacked column (bar, counters, info, park, actions, hand). Wide screens: park left, controls + full cards + day log right. Single committed dark "jungle at dusk" look. */
:root{
  --bg:#12301f; --panel:#1a3f2a; --panel2:#224d33;
  --tile:#3b7447; --tile2:#427d4e; --tile3:#356b40; --path:#c9b688; --rock:#1c201b; --rock-line:#ffffff24;
  --paper:#f4efe1; --ink:#1d2a21;
  --text:#eaf2e3; --muted:#9fbba5;
  --attr:#ff9f1c; --schutz:#2ec4b6; --bad:#ff5a5f; --gold:#ffd166;
  --c-gehege:#86c96f; --c-attr:#ff7a98; --c-essen:#ffcf4a; --c-schutz:#b49af0;
  --h-wasser:#5cbfe3; --h-savanne:#e2c46e; --h-wald:#7cc860; --h-wueste:#e8a070;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.3;
  background-image:radial-gradient(circle at 20% 0%,#1d4a31 0,transparent 55%),radial-gradient(circle at 100% 100%,#0d2518 0,transparent 60%);
  -webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.app{height:100%;max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px;display:flex;flex-direction:column;gap:6px}
.side{display:contents}
.top{order:1}.goal{order:2}.counters{order:3}.infowrap{order:4}.boardarea{order:5}.actions{order:6}.handbar{order:7}.hand{order:8}.log{display:none}

.top{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-size:22px;letter-spacing:.5px;color:var(--gold);line-height:1}
.season{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.season-name{font-family:var(--f-display);font-size:15px;white-space:nowrap}
.dots{display:flex;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--muted)}
.dot.done{background:var(--gold);border-color:var(--gold)}
.dot.now{border-color:var(--gold);box-shadow:0 0 0 3px #ffd16633}
.icbtn{border:0;background:var(--panel2);color:var(--text);width:32px;height:32px;border-radius:9px;font-size:15px;font-weight:600;flex:none}

.goal{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.goal b{color:var(--text);font-weight:600}
.bar{flex:1;height:8px;border-radius:6px;background:#0c2216;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ffb347);border-radius:6px;transition:width .5s ease}
.bar.full i{background:linear-gradient(90deg,#7ee081,var(--gold))}

.counters{display:grid;grid-template-columns:1fr auto 1fr auto 1.25fr;align-items:center;gap:5px}
.cnt{border-radius:10px;padding:4px 6px;text-align:center;font-variant-numeric:tabular-nums;min-width:0}
.cnt label{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt span{font-family:var(--f-display);font-size:23px;line-height:1.05;display:block}
.cnt small{display:block;font-size:10px;min-height:12px;line-height:1.2;opacity:.9}
.cnt.a{background:var(--attr);color:#3a1d00}
.cnt.s{background:var(--schutz);color:#00302b}
.cnt.t{background:var(--panel2);border:2px solid #ffffff1a}
.cnt.t span{color:var(--gold)}
.op{font-family:var(--f-display);font-size:20px;color:var(--muted)}
.cnt.pop{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.14)}}

.infowrap{position:relative;height:66px;flex:none;z-index:6}
.info{position:absolute;left:0;right:0;top:0;background:var(--panel);border-radius:10px;padding:6px 10px;min-height:66px;max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:3px;box-shadow:0 8px 20px #0007}
.info h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.15}
.info p{margin:0;font-size:12.5px}
.info .hint{color:var(--muted)}
.tag{font-family:var(--f-body);font-size:10px;font-weight:600;padding:1px 6px;border-radius:99px;color:var(--ink);letter-spacing:.02em}
.vals{display:flex;gap:5px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.chip{font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:5px}
.chip.a{background:#ff9f1c33;color:var(--attr)} .chip.s{background:#2ec4b633;color:var(--schutz)} .chip.n{background:#ffffff14;color:var(--muted)}
.chip.bad{background:#ff5a5f33;color:#ffb3b5}

.boardarea{flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
.boardwrap{position:relative;aspect-ratio:var(--ar,1);width:min(100cqw,calc(100cqh * var(--ar,1)))}
.boardwrap.zoomed{overflow:hidden;border-radius:12px;box-shadow:inset 0 0 0 2px #ffd16655}
.boardwrap.zoomed #board{cursor:grab}
.zoombtn{position:absolute;top:4px;right:4px;z-index:7;width:34px;height:34px;border-radius:50%;border:0;background:#0f2518d9;color:var(--text);font-size:16px;box-shadow:0 2px 8px #0006}
.zoomed .zoombtn{background:var(--gold)}
.minimap{position:absolute;right:6px;bottom:6px;width:72px;height:auto;z-index:7;background:#0f2518d9;border-radius:8px;padding:3px;display:none;pointer-events:none}
.zoomed .minimap{display:block}
.minimap .mc{fill:var(--tile)} .minimap .mc.block{fill:var(--rock)} .minimap .mv{fill:#ffd16622;stroke:var(--gold);stroke-width:4}
#board{display:block;width:100%;height:100%;touch-action:none;-webkit-tap-highlight-color:transparent}
#board .base{fill:var(--path)}
#board .cell{fill:var(--tile);cursor:pointer;transition:fill .15s}
#board .cell.t1{fill:var(--tile2)} #board .cell.t2{fill:var(--tile3)}
#board .cell:hover{fill:#4d8f5a}
#board .terr{cursor:pointer}
#board .terr.wasser{fill:var(--h-wasser)} #board .terr.savanne{fill:var(--h-savanne)} #board .terr.wald{fill:var(--h-wald)} #board .terr.wueste{fill:var(--h-wueste)}
#board .block{fill:var(--rock)} #board .hatch{fill:url(#hatch)} #board .hatch line{stroke:var(--rock-line);stroke-width:1.1}

#board .tic{font-size:6px;text-anchor:middle;dominant-baseline:central;pointer-events:none;opacity:.8}
#board .tic.blk{font-size:11px;opacity:.9}
#board .bld{cursor:pointer;transform-box:fill-box;transform-origin:center}
.hx{stroke-width:.8}
.fence{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-linecap:round}
#board .ic{font-size:9px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
#board .ic.big{font-size:12px}
#board .natdot{fill:#ffffffaa;pointer-events:none}
.hab-wasser .hx{fill:var(--h-wasser);stroke:var(--h-wasser)} .hab-savanne .hx{fill:var(--h-savanne);stroke:var(--h-savanne)}
.hab-wald .hx{fill:var(--h-wald);stroke:var(--h-wald)} .hab-wueste .hx{fill:var(--h-wueste);stroke:var(--h-wueste)}
.cat-attr .hx,.cat-essen .hx,.cat-schutz .hx{fill:var(--paper);stroke:var(--paper)}
.cat-attr .fence{stroke:var(--c-attr);stroke-width:2.2} .cat-essen .fence{stroke:var(--c-essen);stroke-width:2.2} .cat-schutz .fence{stroke:var(--c-schutz);stroke-width:2.2}
#board .bld.pulse{animation:pulse .32s ease}
@keyframes pulse{40%{transform:scale(1.08)}}
#board .bld.sel .fence,#board .bld.hl .fence{stroke:var(--gold);stroke-width:2.2}
#board .bld.hlneg .fence{stroke:var(--bad);stroke-width:2.2}
#board .ghost{cursor:pointer;animation:bob 1.2s ease-in-out infinite}
#board .ghost .hx{opacity:.85}
#board .ghost .fence{stroke-dasharray:2 1.5}
#board .ghost.bad .hx{fill:var(--bad);stroke:var(--bad)}
@keyframes bob{50%{transform:translateY(-1.5px)}}
#board .link{stroke:var(--gold);stroke-width:1.4;stroke-dasharray:3 2;fill:none;stroke-linecap:round;animation:dash .8s linear infinite;pointer-events:none}
#board .link.neg{stroke:var(--bad)}
#board .link.flash{animation:dash .8s linear infinite,fadeout .9s ease forwards}
#board .ldot{fill:var(--gold);pointer-events:none} #board .ldot.neg{fill:var(--bad)}
@keyframes dash{to{stroke-dashoffset:-10}}
@keyframes fadeout{0%,60%{opacity:1}to{opacity:0}}

.fxh{position:absolute;inset:0;pointer-events:none}
.float{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:17px;z-index:5;
  text-shadow:0 2px 0 #0009;animation:rise .95s ease-out forwards;white-space:nowrap}
.float.a{color:var(--attr)} .float.s{color:var(--schutz);margin-top:17px} .float.neg{color:var(--bad)} .float.m{color:var(--gold);font-size:21px}
@keyframes rise{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,calc(-50% - 32px))}}
.badge{position:absolute;transform:translate(-50%,-135%);background:var(--ink);border:2px solid var(--gold);border-radius:8px;
  padding:1px 5px;font-size:11px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 3px 8px #0007;z-index:4}
.badge.neg{border-color:var(--bad)}
.badge.flash{animation:fadeout 1s ease forwards}
.badge .a{color:var(--attr)} .badge .s{color:var(--schutz)} .badge .n{color:#ffb3b5}
.skiphint{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:11px;color:var(--muted);pointer-events:none}

.actions{display:flex;gap:7px;flex:none}
.btn{border:0;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.btn.main{background:var(--gold);color:#3a2a00;flex:1;font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.3px}
.btn.sub{background:var(--panel2);color:var(--text)}
.btn.go{background:#7ee081;color:#0e2e14}
.btn:disabled{opacity:.4;cursor:default}

.handbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none;font-size:12px;color:var(--muted);font-weight:600}
.bp{display:flex;align-items:center;gap:6px;letter-spacing:.06em;text-transform:uppercase}
.bp i{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid var(--gold);margin-left:2px}
.bp i.on{background:var(--gold)}
.deckbtn{border:0;background:var(--panel2);color:var(--text);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}

.hand{display:flex;gap:6px;flex:none;padding-top:4px}
.card{flex:1 1 0;min-width:0;background:var(--paper);color:var(--ink);border:0;border-radius:10px;padding:0 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 4px 0 #0000004d;transition:transform .15s ease,opacity .2s;overflow:hidden;text-align:center;touch-action:none;position:relative}
.card .band{width:100%;height:5px;flex:none}
.card .row{display:flex;align-items:center;gap:2px;margin-top:3px}
.card .ic{font-size:19px;line-height:1}
.shape{display:block;width:34px;height:22px}
.card .body{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.card .nm{font-size:10.5px;font-weight:600;line-height:1.1;hyphens:auto;-webkit-hyphens:auto;min-height:23px;display:flex;align-items:center;padding-inline:3px;overflow-wrap:anywhere}
.card .st{display:flex;gap:3px;font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums}
.card .st .a,.ocard .st .a{color:#b86500} .card .st .s,.ocard .st .s{color:#00857a}
.card .hb{font-size:9.5px;font-weight:600;color:#4b5a4f;min-height:12px}
.card .tx{display:none}
.card .meta{display:flex;flex-direction:column;align-items:center;gap:2px}
.cost{position:absolute;top:8px;right:4px;display:flex;gap:1.5px}
.cost i{width:5px;height:5px;border-radius:50%;background:var(--ink);display:block}
.card.sel{transform:translateY(-6px);box-shadow:0 0 0 3px var(--gold),0 7px 0 #0000004d}
.card.dragging{opacity:.4}
.card.poor{opacity:.42}
.card:disabled{cursor:default}
.dragimg{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);background:var(--paper);border-radius:12px;padding:6px 8px;
  box-shadow:0 10px 24px #000a,0 0 0 3px var(--gold);display:flex;align-items:center;gap:4px;font-size:22px}

.log{background:var(--panel);border-radius:10px;padding:8px 10px;flex-direction:column;gap:4px}
.log h4{margin:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.log svg{display:block;width:100%;height:auto}
.log .lb{fill:var(--gold)} .log .lb.empty{fill:#ffffff12}
.log text{fill:var(--muted);font-size:9px;font-family:var(--f-body);text-anchor:middle}
.log text.v{fill:var(--text);font-weight:600}
.log .grid{stroke:#ffffff1a;stroke-width:1}
.log .past{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.log .past b{color:var(--text);font-weight:600}

.overlay{position:fixed;inset:0;background:#07170ecc;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;backdrop-filter:blur(3px)}
.modal{background:var(--panel);border-radius:16px;padding:16px;width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px #000a;animation:pop .3s ease;max-height:100%;overflow:auto}
.modal h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--gold);text-wrap:balance}
.modal h3{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.modal p{margin:0}
.modal ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.pile{display:flex;flex-wrap:wrap;gap:5px}
.pile span{background:var(--paper);color:var(--ink);border-radius:7px;padding:2px 7px;font-size:12.5px;font-weight:600;border-left:5px solid}
.pile em{color:var(--muted);font-style:normal;font-size:13px}
.offer{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ocard{background:var(--paper);color:var(--ink);border:0;border-radius:12px;padding:0 6px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;overflow:hidden;box-shadow:0 4px 0 #0000004d;min-width:0}
.ocard:hover{transform:translateY(-3px)}
.ocard .band{align-self:stretch;margin-inline:-6px;min-height:22px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;padding:2px}
.ocard .ic{font-size:30px;line-height:1}
.ocard .shape{width:50px;height:30px}
.ocard .nm{font-family:var(--f-display);font-size:15px;line-height:1.1}
.ocard .tx{font-size:11.5px;line-height:1.25;color:#3b4a3f}
.ocard .st{font-size:12px;font-weight:600;display:flex;gap:6px;font-variant-numeric:tabular-nums}
.rar{font-size:10px;font-weight:600;color:#7a5a00}
.bigscore{font-family:var(--f-display);font-size:38px;color:var(--gold);font-variant-numeric:tabular-nums}
.habrow{display:flex;gap:8px;flex-wrap:wrap}
.habrow span{display:inline-flex;align-items:center;gap:5px;font-size:13px}
.habrow i{width:14px;height:14px;border-radius:4px;display:inline-block}

@media (max-width:380px){.cnt span{font-size:19px}.card .nm{font-size:9.5px}.offer{gap:6px}.ocard .tx{font-size:10.5px}.btn{padding-inline:9px;font-size:13px}.season-name{font-size:13px}}

.money{font-weight:600;background:var(--panel2);border-radius:9px;padding:6px 9px;font-variant-numeric:tabular-nums;color:var(--gold);white-space:nowrap;flex:none;font-size:14px}
.money.neg{color:#ffb3b5;background:#5a1f22}
.money.pop{animation:pop .35s ease}
.progs{display:flex;gap:4px;flex:1;justify-content:center;min-width:0;overflow:hidden}
.prog{width:26px;height:26px;border-radius:7px;background:var(--panel2);border:0;font-size:14px;display:grid;place-items:center;color:var(--text);padding:0;flex:none}
.prog.ad{outline:2px dashed var(--gold);outline-offset:-2px}
.prog.empty{opacity:.4;border:1px dashed var(--muted);background:none;cursor:default}
.rl{position:absolute;top:9px;left:4px;width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 1.5px var(--paper)}
.dupc{position:absolute;top:17px;right:3px;font-size:9px;font-weight:700;color:#c0392b}
#board .rlmark{fill:var(--bad);stroke:var(--paper);stroke-width:.7;pointer-events:none}
#board .dupm{font-size:4.6px;font-weight:700;fill:var(--ink);text-anchor:middle;pointer-events:none}
.badge.big{transform:translate(-50%,-118%);display:flex;flex-direction:column;align-items:center;line-height:1.25;padding:2px 7px}
.badge .base{color:#cfd8cc;font-weight:500}
.infobtn{margin-top:2px;align-self:flex-start;border:0;border-radius:8px;padding:4px 10px;background:var(--panel2);color:var(--text);font-size:12.5px;font-weight:600}
.infobtn:disabled{opacity:.45;cursor:default}
.brk{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.brk b{color:var(--text);font-weight:600}
.brk .p{color:var(--gold)} .brk .m{color:#ffb3b5}
.shopgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.item{background:var(--paper);color:var(--ink);border:0;border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:3px;text-align:left;box-shadow:0 3px 0 #0000004d;min-width:0}
.item .kind{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#5d6b60}
.item .nm{font-family:var(--f-display);font-size:15px;line-height:1.1}
.item .tx{font-size:12px;line-height:1.25;color:#3b4a3f}
.item .price{font-weight:600;color:#7a5a00;font-variant-numeric:tabular-nums}
.item:disabled{opacity:.45;cursor:default}
.item.sold{opacity:.35}
.shopbar{display:flex;gap:8px;flex-wrap:wrap}
.slotrow{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.slotrow span{background:var(--panel2);border-radius:8px;padding:3px 8px}
.modal.wide{max-width:600px}
.winter #board .cell{fill:#6e8f84} .winter #board .cell.t1{fill:#779a8e} .winter #board .cell.t2{fill:#67877c}
.winter #board .base{fill:#e6eef0}
@media (max-width:480px){.brand{display:none}.season-name{font-size:14px}}
/* wide screens: park + hand left, controls right */
@media (min-width:860px) and (min-aspect-ratio:1/1){
  .app{max-width:1320px;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr) auto auto;column-gap:22px;row-gap:8px;padding-block:14px}
  .boardarea{grid-row:1;grid-column:1}
  .handbar{grid-row:2;grid-column:1}
  .hand{grid-row:3;grid-column:1;gap:8px}
  .side{display:flex;flex-direction:column;gap:9px;grid-column:2;grid-row:1/4;min-height:0;overflow:auto;padding-right:2px}
  .top{flex-wrap:nowrap}
  .brand{display:block;font-size:26px}
  .season{flex-direction:column;align-items:flex-end;gap:4px}
  .infowrap{height:auto}
  .info{position:static;min-height:110px;max-height:none;box-shadow:none}
  .cnt span{font-size:28px}
  .card{padding:0 8px 8px;gap:3px}
  .card .ic{font-size:24px}
  .card .shape{width:42px;height:26px}

<script>
document.documentElement.lang='de';
//ENGINE-START
const DAYS=6,HAND=5,BP=4,MAXPROGS=4,MAXLVL=3;
const ROMAN=['','I','II','III'];
const SEASONS=[{name:'Frühling',target:5000},{name:'Sommer',target:35000},{name:'Herbst',target:120000},{name:'Winter',target:260000,winter:true}];
const EARLY_BONUS=5; // Taler je übrigem Tag, wenn das Saisonziel früh erreicht ist
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const hk=(q,r)=>q+','+r;
let BOARD=[],ONBOARD=new Set();
function setBoard(cells){BOARD=cells.map(c=>c.slice());ONBOARD=new Set(BOARD.map(([q,r])=>hk(q,r)))}
const hexDisc=(R,cq=0,cr=0)=>{const o=[];for(let q=-R;q<=R;q++)for(let r=-R;r<=R;r++)if(Math.abs(q+r)<=R)o.push([q+cq,r+cr]);return o};
setBoard(hexDisc(5));
const SHAPES={
  s1:{cells:[[0,0]],label:'1 Feld'},
  s2:{cells:[[0,0],[1,0]],label:'2 Felder'},
  l3:{cells:[[-1,0],[0,0],[1,0]],label:'3er-Reihe'},
  t3:{cells:[[0,0],[1,0],[0,1]],label:'Dreieck'},
  b3:{cells:[[-1,0],[0,0],[0,1]],label:'Bogen'},
  l4:{cells:[[-1,0],[0,0],[1,0],[2,0]],label:'4er-Reihe'},
  d4:{cells:[[0,0],[1,0],[0,1],[1,1]],label:'Raute'},
  z4:{cells:[[-1,0],[0,0],[0,1],[1,1]],label:'Zickzack'},
};
function rotCells(cells,rot){let c=cells.map(x=>x.slice());for(let i=0;i<((rot%6)+6)%6;i++)c=c.map(([q,r])=>[-r,q+r]);return c}
function placeCells(key,rot,q,r){return rotCells(SHAPES[CARDS[key].shape].cells,rot).map(([a,b])=>[a+q,b+r])}
const costOf=key=>SHAPES[CARDS[key].shape].cells.length;

const CAT={gehege:{label:'Gehege',col:'var(--c-gehege)'},attr:{label:'Attraktion',col:'var(--c-attr)'},
  essen:{label:'Essen',col:'var(--c-essen)'},schutz:{label:'Artenschutz',col:'var(--c-schutz)'}};
const HAB={wasser:{label:'Wasser',icon:'💧',col:'var(--h-wasser)',terr:'Wasser'},savanne:{label:'Savanne',icon:'🌾',col:'var(--h-savanne)',terr:'Savanne'},
  wald:{label:'Wald',icon:'🌿',col:'var(--h-wald)',terr:'Wald'},wueste:{label:'Wüste',icon:'🏜️',col:'var(--h-wueste)',terr:'Wüste'}};
const RARW={gewöhnlich:10,selten:5,'sehr selten':2,winter:0};
let CTX={winter:false,progs:[],ads:[]};
const K=n=>CARDS[n.key];
const has=(n,t)=>(K(n).tags||[]).includes(t);
const isCat=(n,c)=>K(n).cat===c;
const isHab=(n,h)=>K(n).hab===h;
const cnt=(arr,f)=>arr.filter(f).length;
const essenMalus=nb=>-cnt(nb,n=>isCat(n,'gehege'));
const cold=h=>h==='savanne'||h==='wueste';

const CARDS={
  pinguine:{name:'Pinguinbecken',icon:'🐧',cat:'gehege',hab:'wasser',shape:'s1',a:3,s:2,rar:'gewöhnlich',

function mkIndex(bs){const m=new Map();for(const b of bs)for(const[q,r]of b.cells)m.set(hk(q,r),b);return m}
function nbrs(b,idx){const s=new Set();for(const[q,r]of b.cells)for(const[dq,dr]of DIRS){const o=idx.get(hk(q+dq,r+dr));if(o&&o!==b)s.add(o)}return[...s]}
const natCells=(cells,hab)=>hab?cnt(cells,([q,r])=>TERR.get(hk(q,r))===hab):0;
const upStep=b=>Math.ceil(b.cells.length/2); // Ausbau: +1 A und +1 S je angefangene 2 Felder
const dupOf=(b,bs)=>{let n=0;for(const x of bs){if(x===b)break;if(x.key===b.key)n++}return n};
// value of one building, with a labelled breakdown
function evalB(b,bs,idx,parts){const c=CARDS[b.key],nb=nbrs(b,idx);let a=c.a,s=c.s;
  const add=(label,da,ds)=>{da=da||0;ds=ds||0;if(!da&&!ds)return;a+=da;s+=ds;if(parts)parts.push({label,a:da,s:ds})};
  const lv=b.lvl||1;if(lv>1){const u=(lv-1)*upStep(b);add(`Ausbau Stufe ${ROMAN[lv]}`,u,u)}
  const d=dupOf(b,bs);if(d)add(`${d+1}. ${c.name}: Besucher kennen das schon`,-d,0);
  if(c.hab){add(`${HAB[c.hab].label}-Nachbarn`,cnt(nb,n=>isCat(n,'gehege')&&isHab(n,c.hab)),0);add(`${HAB[c.hab].label}-Naturfläche`,0,natCells(b.cells,c.hab));
    if(CTX.winter&&cold(c.hab))add('Winterkälte',-1,0)}
  if(c.bonus){const r=c.bonus(nb,bs);add('Kartenbonus',r.a,r.s)}
  for(const id of CTX.progs){const e=PROGS[id].per&&PROGS[id].per(b,c,nb);if(e)add(PROGS[id].name,e.a,e.s)}
  for(const id of CTX.ads){const e=ADS[id].per&&ADS[id].per(b,c,nb);if(e)add(ADS[id].name,e.a,e.s)}
  return{a,s,nb}}
function scoreZoo(bs){const idx=mkIndex(bs);let A=0,S=0;const steps=[],mults=[];
  for(const b of bs){const c=CARDS[b.key],v=evalB(b,bs,idx);A+=v.a;S+=v.s;steps.push({id:b.id,a:v.a,s:v.s,ba:c.a,bs:c.s});
    if(c.mult){const m=c.mult(v.nb,bs);if(m)mults.push({id:b.id,label:c.name,...m})}}
  for(const id of CTX.progs){const m=PROGS[id].mult&&PROGS[id].mult(bs);if(m)mults.push({id:null,label:PROGS[id].name,icon:PROGS[id].icon,...m})}
  for(const id of CTX.ads){const m=ADS[id].mult&&ADS[id].mult(bs);if(m)mults.push({id:null,label:ADS[id].name,icon:ADS[id].icon,...m})}
  let A2=A,S2=S;for(const m of mults){if(m.ma)A2*=m.ma;if(m.ms)S2*=m.ms}
  A2=Math.max(0,Math.round(A2));S2=Math.max(0,Math.round(S2));return{steps,mults,A:A2,S:S2,total:A2*S2}}
function breakdown(b,bs){const parts=[];const v=evalB(b,bs,mkIndex(bs),parts);return{a:v.a,s:v.s,parts}}
function sourcesOf(b,bs){const idx=mkIndex(bs),full=evalB(b,bs,idx),out=[];
  for(const n of full.nb){const bs2=bs.filter(x=>x!==n),v=evalB(b,bs2,mkIndex(bs2));const da=full.a-v.a,ds=full.s-v.s;if(da||ds)out.push({id:n.id,da,ds})}return out}
const builtUnique=(bs,key)=>CARDS[key].tags.includes('einmalig')&&bs.some(b=>b.key===key);
function fits(bs,cells,key){const idx=mkIndex(bs),c=CARDS[key];if(builtUnique(bs,key))return false;
  return cells.every(([q,r])=>{const k=hk(q,r);if(!ONBOARD.has(k)||idx.has(k))return false;const t=TERR.get(k);return!t||(t!=='block'&&(c.cat!=='gehege'||c.hab===t))})}
function weightOf(k){const c=CARDS[k];return c.rar==='winter'?(CTX.winter?8:0):RARW[c.rar]}
function pickWeighted(keys,rnd=Math.random){const tot=keys.reduce((t,k)=>t+weightOf(k),0);let r=rnd()*tot;
  for(const k of keys){r-=weightOf(k);if(r<=0)return k}return keys[keys.length-1]}
function makeOffer(n=3,rnd=Math.random,bs=(typeof state!=='undefined'&&state)?state.buildings:[]){const pool=Object.keys(CARDS).filter(k=>weightOf(k)>0&&!builtUnique(bs,k)),out=[];
  while(out.length<n)out.push(pickWeighted(pool.filter(p=>!out.includes(p)),rnd));return out}
function shuffle(a,rnd=Math.random){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function drawHand(st,rnd=Math.random){while(st.hand.length<HAND){if(!st.deck.length){if(!st.discard.length)break;st.deck=shuffle(st.discard,rnd);st.discard=[]}st.hand.push(st.deck.pop())}}

function dayIncome(A,S,money){const base=Math.round(A/6-S/8);const interest=money>=0?Math.min(5,Math.floor(money/10)):-Math.floor(-money/10);return{base,interest,total:base+interest}}

const SZ=10,SQ3=Math.sqrt(3);
let ROT=false,EDGE=[];
const px=(q,r)=>{const x=SZ*SQ3*(q+r/2),y=SZ*1.5*r;return ROT?[-y,x]:[x,y]};
function hexPts(cx,cy,s){let p=[];for(let i=0;i<6;i++){const a=Math.PI/180*(60*i+(ROT?0:-30));p.push((cx+s*Math.cos(a)).toFixed(2)+','+(cy+s*Math.sin(a)).toFixed(2))}return p.join(' ')}
function setRot(v){ROT=v;EDGE=DIRS.map(([dq,dr])=>{const[x,y]=px(dq,dr),t=Math.atan2(y,x),d=Math.PI/6;return[[Math.cos(t-d),Math.sin(t-d)],[Math.cos(t+d),Math.sin(t+d)]]})}
setRot(false);
function withRot(v,fn){const o=ROT;setRot(v);try{return fn()}finally{setRot(o)}}
function shapeSvg(cells,sz=SZ){const set=new Set(cells.map(([q,r])=>hk(q,r)));let polys='',d='';
  for(const[q,r]of cells){const[x,y]=px(q,r);polys+=`<polygon class="hx" points="${hexPts(x,y,sz)}"/>`;
    DIRS.forEach(([dq,dr],i)=>{if(set.has(hk(q+dq,r+dr)))return;const[[a1,b1],[a2,b2]]=EDGE[i];
      d+=`M${(x+a1*sz).toFixed(2)},${(y+b1*sz).toFixed(2)}L${(x+a2*sz).toFixed(2)},${(y+b2*sz).toFixed(2)}`})}
  return polys+`<path class="fence" d="${d}"/>`}
const centroid=cells=>{let x=0,y=0;for(const[q,r]of cells){const p=px(q,r);x+=p[0];y+=p[1]}return[x/cells.length,y/cells.length]};
let VB=[0,0,1,1];
function bbox(cells){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const[q,r]of cells){const[x,y]=px(q,r);x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}return[x0,y0,x1,y1]}

function computeView(){const[x0,y0,x1,y1]=withRot(false,()=>bbox(BOARD)),bw=x1-x0+SZ*2,bh=y1-y0+SZ*2,ar=bw/bh;
  const area=document.querySelector('.boardarea'),W=area?area.clientWidth:0,H=area?area.clientHeight:0;let rot;
  if(W>0&&H>0){const flat=Math.min(W/bw,H/bh),up=Math.min(W/bh,H/bw);rot=up>flat*1.08} // drehen, wenn die Karte dadurch größer wird

  document.getElementById('bwrap').style.setProperty('--ar',(VB[2]/VB[3]).toFixed(4))}
const boardCenter=()=>[VB[0]+VB[2]/2,VB[1]+VB[3]/2];

const ZF=1.8;let ZOOM=null;
function viewNow(){if(!ZOOM)return VB;const w=VB[2]/ZF,h=VB[3]/ZF;
  ZOOM.cx=Math.max(VB[0]+w/2,Math.min(VB[0]+VB[2]-w/2,ZOOM.cx));ZOOM.cy=Math.max(VB[1]+h/2,Math.min(VB[1]+VB[3]-h/2,ZOOM.cy));

  const p=pt.matrixTransform(m.inverse()),X=ROT?p.y:p.x,Y=ROT?-p.x:p.y;let qf=(SQ3/3*X-Y/3)/SZ,rf=(2/3*Y)/SZ,sf=-qf-rf;

function bTxt(da,ds){const p=[];if(da)p.push(`<span class="${da>0?'a':'n'}">${da>0?'+':'−'}${Math.abs(da)} A</span>`);if(ds)p.push(`<span class="${ds>0?'s':'n'}">${ds>0?'+':'−'}${Math.abs(ds)} S</span>`);return p.join(' ')}
function tagHtml(c){const t=c.hab?`${habBadge(c.hab)} ${HAB[c.hab].label}-Gehege`:CAT[c.cat].label;return`<span class="tag" style="background:${colOf(c)}">${t} · ${SHAPES[c.shape].label}</span>${c.tags.includes('bedroht')?'<span class="tag" style="background:var(--bad);color:#fff">Rote Liste</span>':''}${c.tags.includes('einmalig')?'<span class="tag" style="background:var(--gold)">Einmalig</span>':''}`}

function brkHtml(c,brk){return`<div class="brk"><span>Grundwert <b>${c.a} A · ${c.s} S</b></span>${brk.parts.map(p=>`<span class="${p.a+p.s<0?'m':'p'}">${p.label} ${vTxt(p.a,p.s)}</span>`).join('')}<span>= <b>${brk.a} A · ${brk.s} S</b></span></div>`}
const habLine=c=>c.hab?` Lebensraum: +1 A je ${HAB[c.hab].label}-Nachbar, +1 S je Feld auf ${HAB[c.hab].label}-Naturfläche.${CTX.winter&&cold(c.hab)?' Im Winter −1 A.':''}`:'';

function renderLog(){const se=SEASONS[state.season],vals=Array.from({length:DAYS},(_,i)=>state.dayPts[i]);

      g+=`<path class="lb" d="M${x},${H-bot}V${y+4}Q${x},${y} ${x+4},${y}H${x+w-4}Q${x+w},${y} ${x+w},${y+4}V${H-bot}Z"><title>Tag ${i+1}: ${fmt(v)} Punkte</title></path><text class="v" x="${x+w/2}" y="${y-4}">${fmt(v)}</text>`}

  else if(u.t==='up'){const b=state.buildings.find(b=>b.id===u.id);if(b)b.lvl=Math.max(1,(b.lvl||1)-1);put(u.key,u.hi);state.bp+=costOf(u.key);state.builtToday--}
  else if(u.t==='move'){state.buildings.splice(Math.min(u.i,state.buildings.length),0,u.b);for(let i=0;i<u.n;i++){const j=state.discard.lastIndexOf(u.b.key);if(j>=0)state.discard.splice(j,1)}state.bp+=1}
  state.selected=null;state.preview=null;state.info=null;Sfx.rotate();Sfx.draw();render()}

// beim Ziehen einer Karte oder der Vorschau an den Rand scrollt der Ausschnitt mit
function edgeScroll(x,y){if(!ZOOM)return false;const r=$b().getBoundingClientRect(),m=34,step=viewNow()[2]*.05;let dx=0,dy=0;
  if(x<r.left+m&&x>r.left-m)dx=-step;else if(x>r.right-m&&x<r.right+m)dx=step;if(y<r.top+m&&y>r.top-m)dy=-step;else if(y>r.bottom-m&&y<r.bottom+m)dy=step;
  if(!dx&&!dy)return false;ZOOM.cx+=dx;ZOOM.cy+=dy;return true}

function build(){const h=hypo();if(!h||!h.ok||state.phase!=='play')return;const key=state.hand[state.selected],hi=state.selected;
  if(h.up){h.up.lvl=(h.up.lvl||1)+1;state.undo.push({t:'up',id:h.up.id,key,hi})}
  else{const id=state.nextId++;state.buildings.push({id,key,cells:h.cells,lvl:1});state.undo.push({t:'build',id,key,hi})}
  state.bp-=costOf(key);state.hand.splice(hi,1);state.builtToday++; // gebaute Karten sind verbraucht
  state.selected=null;state.preview=null;state.info=null;Sfx.build();render()}

/* ---------- scoring ---------- */
async function startScoring(){state.phase='scoring';fast=false;render();
  const bs=state.buildings,r=scoreZoo(bs),byId=Object.fromEntries(bs.map(b=>[b.id,b]));let a=0,s=0,i=0;
  setCounters(0,0,0);$('tLabel').textContent=`Tag ${state.day+1}`;
  const quick=()=>fast||reduced;
  const dt=()=>quick()?0:Math.max(160,Math.min(420,3400/Math.max(1,r.steps.length)));
  await wait(quick()?0:350);
  for(const st of r.steps){const b=byId[st.id],c=centroid(b.cells),el=$b().querySelector(`[data-bid="${st.id}"]`);
    if(el){el.classList.remove('pulse');el.getBoundingClientRect();el.classList.add('pulse')}
    {const srcs=sourcesOf(b,bs),pos=cnt(srcs,x=>x.da+x.ds>0),neg=cnt(srcs,x=>x.da+x.ds<0),tier=Math.min(3,Math.floor(pos/2));
      if(el){if(neg>pos)el.classList.add('glowneg');else if(tier)el.classList.add('glow'+tier)}
      if(tier===3&&!quick()){sparks(c);Sfx.sparkle()}}
    a+=st.a;s+=st.s;
    if(st.a)floatAt(c,(st.a>0?'+':'−')+Math.abs(st.a)+' A',st.a>0?'a':'a neg');
    if(st.s)floatAt(c,(st.s>0?'+':'−')+Math.abs(st.s)+' S',st.s>0?'s':'s neg');
    if(!quick()){Sfx.chip(i,r.steps.length,st.a!==0,st.s!==0);const fx=$('fxl');let k=0;
      for(const src of sourcesOf(b,bs)){const n=centroid(byId[src.id].cells),neg=src.da+src.ds<0;
        fx.insertAdjacentHTML('beforeend',`<line class="link flash ${neg?'neg':''}" x1="${n[0]}" y1="${n[1]}" x2="${c[0]}" y2="${c[1]}"/>`);
        const[x,y]=pct(n),bd=document.createElement('span');bd.className='badge flash'+(neg?' neg':'');bd.style.left=x+'%';bd.style.top=y+'%';bd.innerHTML=bTxt(src.da,src.ds);$('fxh').appendChild(bd);
        setTimeout(()=>bd.remove(),1000);if(neg)Sfx.neg();else Sfx.bonus(i,r.steps.length,k++)}
      setTimeout(()=>fx.querySelectorAll('.flash').forEach(l=>l.remove()),950)}
    setCounters(Math.max(0,a),Math.max(0,s));if(st.a)bump('cA');if(st.s)bump('cS');i++;await wait(dt())}
  for(const m of r.mults){const c=m.id!=null?centroid(byId[m.id].cells):boardCenter();
    if(m.ma){a*=m.ma;floatAt(c,`${m.icon||''} ×${String(m.ma).replace('.',',')} A`,'m');bump('cA')}if(m.ms){s*=m.ms;floatAt(c,`${m.icon||''} ×${String(m.ms).replace('.',',')} S`,'m');bump('cS')}
    if(!quick())Sfx.mult();setCounters(Math.max(0,Math.round(a)),Math.max(0,Math.round(s)));await wait(quick()?0:550)}
  setCounters(r.A,r.S);
  const dur=quick()?0:Math.min(1.8,.5+Math.log10(Math.max(10,r.total))*.3);
  if(r.total>0&&dur>0){Sfx.coins(dur);const t0=performance.now();
    await new Promise(res=>{const tick=now=>{const f=Math.min(1,(now-t0)/(dur*1000));$('vT').textContent=fmt(r.total*(1-(1-f)**2));if(f<1&&!fast)requestAnimationFrame(tick);else res()};requestAnimationFrame(tick)})}
  $('vT').textContent=fmt(r.total);bump('cT');await wait(quick()?0:300);
  // money
  const inc=dayIncome(r.A,r.S,state.money);state.money+=inc.total;state.lastIncome=inc;
  const mo=$('money');mo.textContent=`🪙 ${fmt(state.money)}`;mo.classList.toggle('neg',state.money<0);mo.classList.remove('pop');void mo.offsetWidth;mo.classList.add('pop');
  floatAt([VB[0]+VB[2]/2,VB[1]+VB[3]*.12],`🪙 ${sgn(inc.total)}`,inc.total>=0?'m':'m neg');if(!quick()&&inc.total)Sfx.till();
  state.yday={A:r.A,S:r.S,total:r.total};state.seasonScore+=r.total;state.totalScore+=r.total;state.lastDay=r.total;state.dayPts[state.day]=r.total;
  const se=SEASONS[state.season];$('sScore').textContent=fmt(state.seasonScore);
  $('bar').firstElementChild.style.width=Math.min(100,state.seasonScore/se.target*100)+'%';renderLog();
  await wait(quick()?0:650);
  endDay()}
function endDay(){const se=SEASONS[state.season];state.picks=state.pickTotal=state.builtToday;state.earlyBonus=0;
  if(state.seasonScore>=se.target){const left=DAYS-1-state.day;state.earlyBonus=left*EARLY_BONUS;state.money+=state.earlyBonus;
    state.phase=state.season===SEASONS.length-1?'win':'seasonWon';Sfx.win();render()}
  else if(state.day===DAYS-1){state.phase='lost';Sfx.lose();render()}
  else nextDraft()}
function nextDraft(){if(state.picks>0){state.phase='draft';state.offer=makeOffer();Sfx.draw();render()}else advance()}
function pick(i){if(i!=null)state.discard.push(state.offer[i]);state.offer=[];state.picks--;Sfx.select();
  if(state.picks>0){state.offer=makeOffer();Sfx.draw();render()}else advance()}
function advance(){
  if(state.pendingSeason){openShop();return}
  state.day++;startDay()}
function beginNextSeason(){state.pendingSeason=false;state.shop=null;state.shopSub=null;
  state.past.push({name:SEASONS[state.season].name,pts:state.seasonScore});state.season++;state.day=0;state.seasonScore=0;state.dayPts=[];
  state.ads=state.adsNext;state.adsNext=[];syncCtx();startDay()}

/* ---------- shop ---------- */
function openShop(){state.phase='shop';state.shopSub=null;state.shop={rerolls:0,items:genShopItems()};Sfx.draw();render()}
function genShopItems(){const pick=a=>a.length?a.splice(Math.floor(Math.random()*a.length),1)[0]:null;
  const progs=Object.keys(PROGS).filter(id=>!state.progs.includes(id)),ads=Object.keys(ADS).filter(id=>!state.adsNext.includes(id));
  const nextWinter=!!(SEASONS[state.season+1]||{}).winter;
  const cards=Object.keys(CARDS).filter(k=>(['selten','sehr selten'].includes(CARDS[k].rar)||(CARDS[k].rar==='winter'&&nextWinter))&&!builtUnique(state.buildings,k));
  const out=[];for(const[kind,arr]of[['prog',progs],['prog',progs],['ad',ads],['card',cards]]){const k=pick(arr);if(k)out.push(mkItem(kind,k))}return out}
const inflation=()=>1+.5*state.season; // Preise steigen jede Saison um 50 %
const priced=p=>Math.round(p*inflation());
function mkItem(kind,key){if(kind==='prog')return{kind,key,price:priced(PROGS[key].price)};if(kind==='ad')return{kind,key,price:priced(ADS[key].price)};
  const c=CARDS[key];return{kind,key,price:priced(c.rar==='sehr selten'?12:c.rar==='winter'?9:8)}}
const hasBlocks=()=>[...TERR.values()].includes('block');
function fixedItems(){const f=[{kind:'remove',price:priced(5)},{kind:'bp',price:priced(40+20*state.bpBought)}];if(hasBlocks())f.push({kind:'dozer',price:priced(6)});return f}
const rerollPrice=()=>3+state.shop.rerolls;
function canPay(p){return state.money>=0&&state.money>=p}
function buy(it){if(it.sold||!canPay(it.price)){Sfx.deny();return}
  if(it.kind==='prog'&&state.progs.length>=MAXPROGS){Sfx.deny();state.shop.note='Alle 4 Plätze für Förderprogramme sind belegt.';render();return}
  if(it.kind==='remove'){state.shopSub='remove';render();return}
  state.money-=it.price;Sfx.till();state.shop.note=null;
  if(it.kind==='prog'){state.progs.push(it.key);it.sold=true}
  else if(it.kind==='ad'){state.adsNext.push(it.key);it.sold=true}
  else if(it.kind==='card'){state.discard.push(it.key);it.sold=true}
  else if(it.kind==='bp'){state.bpMax++;state.bpBought++}
  else if(it.kind==='dozer'){const blocks=[...TERR.entries()].filter(([k,v])=>v==='block');const[k]=blocks[Math.floor(Math.random()*blocks.length)];TERR.delete(k);state.terr=[...TERR];state.shop.note='Ein Felsen wurde weggebaggert.'}
  syncCtx();render()}
function removeCard(pile,key){const price=priced(5);if(!canPay(price)){Sfx.deny();return}const arr=state[pile],i=arr.indexOf(key);if(i<0)return;arr.splice(i,1);state.money-=price;Sfx.till();state.shopSub=null;state.shop.note=`${CARDS[key].name} wurde aus dem Deck entfernt.`;render()}
function itemHtml(it,idx,fixed){let kind,name,text,icon;
  if(it.kind==='prog'){const P=PROGS[it.key];kind='Förderprogramm · dauerhaft';name=P.name;text=P.text;icon=P.icon}
  else if(it.kind==='ad'){const P=ADS[it.key];kind='Werbung · nächste Saison';name=P.name;text=P.text;icon=P.icon}
  else if(it.kind==='card'){const c=CARDS[it.key];kind=`Karte · ${c.rar}`;name=c.name;text=`${c.a} A · ${c.s} S · ${costOf(it.key)} BP. ${c.text}`;icon=c.icon}
  else if(it.kind==='remove'){kind='Deck-Pflege';name='Karte entfernen';text='Nimm eine Karte dauerhaft aus deinem Deck.';icon='✂️'}
  else if(it.kind==='bp'){kind='Ausbau';name='+1 Baupunkt';text=`Ab sofort ${state.bpMax+1} Baupunkte pro Tag.`;icon='🧱'}
  else{kind='Ausbau';name='Felsen wegbaggern';text='Entfernt einen zufälligen Felsen oder alten Baum vom Gelände.';icon='🚜'}
  const dis=it.sold||!canPay(it.price);
  return`<button class="item ${it.sold?'sold':''}" data-item="${fixed?'f':'o'}${idx}" ${dis?'disabled':''}><span class="kind">${kind}</span><span class="nm">${icon} ${name}</span><span class="tx">${text}</span><span class="price">${it.sold?'Gekauft':'🪙 '+it.price}</span></button>`}
function shopHtml(){const se=SEASONS[state.season],nx=SEASONS[state.season+1];
  if(state.shopSub==='remove'){const piles=['deck','discard','hand'];let list='';
    for(const p of piles)for(const k of [...new Set(state[p])])list+=`<button class="item" data-rm="${p}|${k}"><span class="nm">${CARDS[k].icon} ${CARDS[k].name}${cnt(state[p],x=>x===k)>1?' ×'+cnt(state[p],x=>x===k):''}</span><span class="tx">${CARDS[k].a} A · ${CARDS[k].s} S · ${costOf(k)} BP</span></button>`;
    return`<h2>Welche Karte entfernen?</h2><p>Kostet 🪙 ${priced(5)}. Die Karte verschwindet dauerhaft aus deinem Deck.</p><div class="shopgrid">${list}</div><button class="btn sub" id="mBack">Zurück</button>`}
  const debt=state.money<0?`<p style="color:#ffb3b5">Du hast Schulden. Mit Schulden kannst du nichts kaufen.</p>`:'';
  const slots=`<div class="slotrow">${state.progs.map(id=>`<span>${PROGS[id].icon} ${PROGS[id].name}</span>`).join('')||'<span>Noch keine Förderprogramme</span>'}${state.adsNext.map(id=>`<span>${ADS[id].icon} ${ADS[id].name} (${nx.name})</span>`).join('')}</div>`;
  return`<h2>Zoo-Shop · 🪙 ${fmt(state.money)}</h2>${debt}${state.shop.note?`<p style="color:var(--gold)">${state.shop.note}</p>`:''}
    <h3>Angebote</h3><div class="shopgrid">${state.shop.items.map((it,i)=>itemHtml(it,i,false)).join('')}</div>
    <h3>Service</h3><div class="shopgrid">${fixedItems().map((it,i)=>itemHtml(it,i,true)).join('')}</div>
    <h3>Förderprogramme ${state.progs.length}/${MAXPROGS}</h3>${slots}
    <div class="shopbar"><button class="btn sub" id="mReroll" ${canPay(rerollPrice())?'':'disabled'}>🎲 Neu würfeln · 🪙 ${rerollPrice()}</button><button class="btn main" id="mLeave">Weiter zum ${nx.name}</button></div>`}

/* ---------- tutorial slideshow ---------- */
function tutSlides(){return withRot(false,()=>{
  const at=(ox,oy,q,r)=>{const[x,y]=px(q,r);return[ox+x,oy+y]};

/* ---------- modals ---------- */
function offerCard(k,i){const c=CARDS[k],d=cnt(state.buildings,b=>b.key===k);return`<button class="ocard" data-pick="${i}">
  <span class="band" style="background:${colOf(c)}">${c.hab?habBadge(c.hab)+' '+HAB[c.hab].label:CAT[c.cat].label} · ${costOf(k)} BP</span>
  <span class="ic">${c.icon}</span>${miniShape(k)}<span class="nm">${c.name}</span><span class="st"><span class="a">${c.a} A</span><span class="s">${c.s} S</span></span>
  <span class="tx">${c.text}</span>${perkN(k)?`<span class="rar">🏅 ${perkN(k)}× verbessert</span>`:''}${c.tags.includes('einmalig')?'<span class="rar">Einmalig im Zoo</span>':''}${c.tags.includes('bedroht')?'<span class="rar" style="color:#c0392b">● Rote Liste</span>':''}${d?`<span class="rar" style="color:#c0392b">schon ${d}× gebaut</span>`:''}${c.rar!=='gewöhnlich'?`<span class="rar">${c.rar}</span>`:''}</button>`}
function pileHtml(keys){if(!keys.length)return'<em>leer</em>';const m={};keys.forEach(k=>m[k]=(m[k]||0)+1);
  return Object.keys(m).sort((a,b)=>CARDS[a].name.localeCompare(CARDS[b].name,'de')).map(k=>`<span style="border-left-color:${colOf(CARDS[k])}">${CARDS[k].icon} ${CARDS[k].name}${m[k]>1?' ×'+m[k]:''}</span>`).join('')}
function helpHtml(){return`<h2>Menü · So wird gespielt</h2><ul>
  <li>Jeden Morgen ziehst du 5 Karten aus deinem Deck und hast <b>4 Baupunkte</b>. Jedes Feld einer Karte kostet 1 Baupunkt.</li>
  <li>Karte aufs Gelände ziehen oder antippen und aufs Feld tippen, mit <b>↻ Drehen</b> ausrichten, dann <b>Bauen</b>. Du kannst mehrere Karten pro Tag bauen.</li>
  <li><b>Tag beenden:</b> Übrige Handkarten kommen auf die Ablage, dann zählt der ganze Zoo: <b>Summe Attraktion × Summe Artenschutz</b>.</li>
  <li>Gebaute Karten sind <b>verbraucht</b>. Für jede gebaute Karte wählst du nach dem Tag 1 von 3 neuen Karten.</li>
  <li><b>Wiederholung:</b> Die zweite Anlage derselben Art bringt −1 Attraktion, die dritte −2 usw. Besucher wollen Abwechslung.</li>
  <li><b>Lebensraum:</b> +1 Attraktion je benachbartes Gehege mit gleichem Lebensraum. Auf <b>Naturflächen</b> dürfen nur passende Gehege (mit +1 Artenschutz je Feld), andere Gehege nicht. Alle anderen Gebäude dürfen dort ohne Bonus stehen.</li>
  <li><b>Umziehen:</b> Gebautes antippen und „Umziehen“ wählen. Kostet 1 Baupunkt, die Karte (samt Ausbaukarten) kommt zurück auf die Ablage.</li>
  <li><b>Ausbauen:</b> Ziehe eine Gehege-Karte auf ein gleiches Gehege. Gleiche Kosten, +1 A und +1 S je angefangene 2 Felder pro Stufe, bis Stufe III. Zählt nicht als Wiederholung.</li>
  <li><b>Speicherplätze und Verbesserungen:</b> Jeder der drei Speicherplätze hat seinen eigenen Zoo. Nach jedem beendeten Spiel verbesserst du eine Karte dauerhaft um +1 A oder +1 S (🏅, bis zu 3-mal pro Karte).</li>
  <li><b>🔍 Zoom</b> oben rechts am Gelände vergrößert den Ausschnitt. Auf freier Fläche ziehen verschiebt ihn. Beim Tagesende geht der Zoom aus.</li>
  <li><b>↶ Rückgängig</b> nimmt Bauen, Ausbauen und Umziehen des heutigen Tages Schritt für Schritt zurück.</li>
  <li><b>Einmalig:</b> Gebäude mit Bonus für den ganzen Zoo (Forschungslabor, Artenvielfalt-Institut, Zoo-Stiftung, Nachtführung) gibt es nur einmal im Zoo.</li>
  <li><b>Rote Liste</b> (roter Punkt): bedrohte Arten. Tierarzt, Zuchtstation und manche Förderprogramme belohnen sie.</li>
  <li><b>Saisonende:</b> Sobald das Ziel erreicht ist, endet die Saison. Jeder übrige Tag bringt +5 Taler.</li>
  <li><b>Geld:</b> Jeder Tag bringt 1 Taler je 6 Attraktion und kostet 1 Taler je 8 Artenschutz. Zinsen: +1 je 10 Taler (max. 5), bei Schulden −1 je 10.</li>
  <li><b>Shop</b> nach jeder Saison (Preise steigen jede Saison um 50 %): Förderprogramme (dauerhaft, 4 Plätze), Werbung (nächste Saison), seltene Karten, Karte entfernen, +1 Baupunkt. Mit Schulden kannst du nichts kaufen.</li>
  <li><b>Winter:</b> Savannen- und Wüstengehege frieren (−1 A).</li></ul>
  <div class="habrow">${Object.values(HAB).map(h=>`<span><i style="background:${h.col}"></i>${h.icon} ${h.label}</span>`).join('')}</div>
  <div class="habrow">${['attr','essen','schutz'].map(k=>`<span><i style="background:var(--paper);border:3px solid ${CAT[k].col}"></i>${CAT[k].label}</span>`).join('')}</div>
  <div class="shopbar"><button class="btn sub" id="mTut">📖 Tutorial</button><button class="btn sub" id="mHome">🏠 Titel</button><button class="btn sub" id="mRestart">⟲ Neues Spiel</button><button class="btn main" id="mClose">Weiterspielen</button></div>`}
function renderModal(){const root=$('modalRoot'),se=state?SEASONS[state.season]:null,inGame=!!state&&!screen;let h='',wide=false;
  if(modal==='help')h=helpHtml();
  else if(modal==='maps'){h=mapsHtml();wide=true}
  else if(modal==='tut'){const sl=tutSlides(),i=Math.max(0,Math.min(tutIdx,sl.length-1)),S=sl[i];
    h=`<div class="tut"><div class="tuthead"><span>Tutorial · ${i+1} / ${sl.length}</span><button class="icbtn" id="mClose" aria-label="Tutorial schließen">✕</button></div>${S.svg}<h2>${S.title}</h2><p>${S.text}</p>
      <div class="dotsnav">${sl.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div>
      <div class="shopbar"><button class="btn sub" id="tPrev" ${i?'':'disabled'}>‹ Zurück</button><button class="btn main" id="tNext">${i<sl.length-1?'Weiter ›':'Los geht’s'}</button></div></div>`}
  else if(modal==='restart')h=`<h2>Neues Spiel starten?</h2><p>Dein aktueller Zoo, dein Deck und deine Kasse gehen verloren.</p><div class="shopbar"><button class="btn sub" id="mClose">Abbrechen</button><button class="btn main" id="mRestartYes">Ja, neu starten</button></div>`;
  else if(modal==='deck')h=`<h2>Dein Deck</h2><h3>Nachziehstapel · ${state.deck.length}</h3><div class="pile">${pileHtml(state.deck)}</div>
    <h3>Ablagestapel · ${state.discard.length}</h3><div class="pile">${pileHtml(state.discard)}</div>
    <h3>Hand · ${state.hand.length}</h3><div class="pile">${pileHtml(state.hand)}</div><button class="btn main" id="mClose">Schließen</button>`;
  else if(inGame&&state.phase==='draft')h=`<h2>Neue Karte ${state.pickTotal-state.picks+1} von ${state.pickTotal}</h2><p>Du hast ${state.pickTotal} Karte${state.pickTotal>1?'n':''} verbaut und darfst genauso viele neue wählen. Sie kommen auf deine Ablage.</p><div class="offer">${state.offer.map(offerCard).join('')}</div><button class="btn sub" data-skip="1">Diese auslassen</button>`;
  else if(inGame&&state.phase==='shop'){h=shopHtml();wide=true}
  else if(inGame&&state.phase==='seasonWon'){const nx=SEASONS[state.season+1];
    h=`<h2>${se.name} geschafft${state.day<DAYS-1?` an Tag ${state.day+1}`:''}!</h2><div class="bigscore">${fmt(state.seasonScore)}</div><p>Ziel war ${fmt(se.target)}.${state.earlyBonus?` Früh fertig: <b>+🪙 ${state.earlyBonus}</b> für ${state.earlyBonus/EARLY_BONUS} übrige Tag${state.earlyBonus/EARLY_BONUS>1?'e':''}.`:''} In der Kasse: 🪙 ${fmt(state.money)}. Nach deinen neuen Karten geht es in den Shop. Im ${nx.name} brauchst du <b>${fmt(nx.target)}</b> Punkte.</p><button class="btn main" id="mNext">Weiter</button>`}
  else if(inGame&&state.phase==='lost')h=`<h2>Saisonziel verfehlt</h2><div class="bigscore">${fmt(state.seasonScore)} / ${fmt(se.target)}</div><p>Der ${se.name} war zu ruhig. Gesamtpunkte: <b>${fmt(state.totalScore)}</b>. Dein Ergebnis kommt in die Highscore-Liste, und du darfst eine Karte dauerhaft verbessern.</p><button class="btn main" id="mFinish">Weiter zur Belohnung</button>`;
  else if(inGame&&state.phase==='win')h=`<h2>Dein Zoo hat das Jahr geschafft!</h2><div class="bigscore">${fmt(state.totalScore)}</div><p>Alle vier Jahreszeiten geschafft. Dein Ergebnis kommt in die Highscore-Liste, und du darfst eine Karte dauerhaft verbessern.</p><button class="btn main" id="mFinish">Weiter zur Belohnung</button>`;
  root.innerHTML=h?`<div class="overlay"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${h}</div></div>`:'';
  root.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pick(+b.dataset.pick));
  root.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>pick(null));
  root.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{const v=b.dataset.item,i=+v.slice(1);buy(v[0]==='f'?fixedItems()[i]:state.shop.items[i])});
  root.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const[p,k]=b.dataset.rm.split('|');removeCard(p,k)});
  const bk=$('mBack');if(bk)bk.onclick=()=>{state.shopSub=null;render()};
  const rr=$('mReroll');if(rr)rr.onclick=()=>{const p=rerollPrice();if(!canPay(p)){Sfx.deny();return}state.money-=p;state.shop.rerolls++;state.shop.items=genShopItems();state.shop.note=null;Sfx.draw();render()};
  const lv=$('mLeave');if(lv)lv.onclick=beginNextSeason;
  const cl=$('mClose');if(cl)cl.onclick=()=>{modal=null;renderAll()};
  const rs=$('mRestart');if(rs)rs.onclick=()=>{modal='restart';render()};
  const ry=$('mRestartYes');if(ry)ry.onclick=()=>openMaps(false);
  root.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>chooseMap(b.dataset.map));
  const mt=$('mTut');if(mt)mt.onclick=()=>{tutIdx=0;modal='tut';render()};
  const tp=$('tPrev');if(tp)tp.onclick=()=>{tutIdx--;renderAll()};
  const tn=$('tNext');if(tn)tn.onclick=()=>{if(tutIdx>=tutSlides().length-1){modal=null;tutIdx=0}else tutIdx++;renderAll()};
  const nx=$('mNext');if(nx)nx.onclick=()=>{state.pendingSeason=true;nextDraft()};
  const mb=$('mMapsBack');if(mb)mb.onclick=()=>{modal=null;if(!state){screen='slots';screenArg={}}renderAll()};
  const fi=$('mFinish');if(fi)fi.onclick=finishGame;
  const ho=$('mHome');if(ho)ho.onclick=()=>{saveMeta();modal=null;screen='title';renderAll()}}

/* ---------- Speicher: drei Speicherplätze, Highscores, Verbesserungen ---------- */
const SAVE_KEY='zoodeck-save-v1';
let META={slots:[null,null,null],active:null,lastSlot:null,scores:[]},screen=null,screenArg={},saveT=0;
function loadMeta(){try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const m=JSON.parse(raw);if(m&&Array.isArray(m.slots)&&m.slots.length===3)META=Object.assign({scores:[]},m)}}catch(e){}}
function saveMeta(){try{const sl=activeSlot();if(sl&&state){sl.game=state;sl.last=Date.now()}localStorage.setItem(SAVE_KEY,JSON.stringify(META))}catch(e){}}
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(saveMeta,400)}
const activeSlot=()=>META.active!=null?META.slots[META.active]:null;
const perkCount=sl=>Object.values(sl&&sl.perks||{}).reduce((t,q)=>t+(q.a||0)+(q.s||0),0);
function restoreGame(s){const ok=s&&Array.isArray(s.deck)&&Array.isArray(s.terr)&&s.buildings.every(b=>Array.isArray(b.cells)&&CARDS[b.key])&&[...s.hand,...s.deck,...s.discard].every(k=>CARDS[k]);
  if(!ok)return false;try{state=Object.assign(DEFAULTS(),s);setBoard(Array.isArray(s.board)&&s.board.length?s.board:hexDisc(5));state.board=BOARD;if(!MAPS[state.map])state.map='wiese';
    if(!Array.isArray(state.undo))state.undo=[];TERR=new Map(s.terr);ZOOM=null;computeView();
    state.progs=state.progs.filter(id=>PROGS[id]);state.ads=state.ads.filter(id=>ADS[id]);state.adsNext=state.adsNext.filter(id=>ADS[id]);
    if(state.phase==='scoring'||(state.phase==='draft'&&!state.picks)||(state.phase==='shop'&&!state.shop))state.phase='play';
    syncCtx();return true}catch(e){console.warn('Spielstand verworfen',e);return false}}
function enterSlot(i,fresh){META.active=i;META.lastSlot=i;const sl=META.slots[i];applyPerks(sl.perks);sl.last=Date.now();
  if(!fresh&&sl.game&&restoreGame(sl.game)){sl.game=state;screen=null;modal=null;saveMeta();renderAll();return}
  state=null;sl.game=null;saveMeta();openMaps(true)}
function finishGame(){const sl=activeSlot(),won=state.phase==='win',date=Date.now();
  META.scores.push({name:sl?sl.name:'Gast',slot:META.active,pts:state.totalScore,map:state.map,season:state.season,won,date});
  META.scores.sort((a,b)=>b.pts-a.pts);META.scores=META.scores.slice(0,100);
  if(sl){sl.game=null;sl.games=(sl.games||0)+1}state=null;modal=null;screen='perk';screenArg={step:'cat',hl:date};saveMeta();Sfx.win();renderAll()}
function renderAll(){if(state&&!screen)render();else renderModal();renderScreen()}

const SEAS_ICON=['🌱','☀️','🍂','❄️'];
const fdate=t=>{try{return new Date(t).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'})}catch(e){return''}};
const fago=t=>{const d=Math.round((Date.now()-t)/60000);return d<1?'gerade eben':d<60?`vor ${d} Min.`:d<1440?`vor ${Math.round(d/60)} Std.`:fdate(t)};
const gameStatus=g=>g?`${MAPS[g.map]?MAPS[g.map].icon+' '+MAPS[g.map].name:''} · ${SEASONS[g.season].name}, Tag ${Math.min(g.day+1,DAYS)}`:'Kein laufendes Spiel';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let titleBgSvg=null;
function titleBg(){if(titleBgSvg)return titleBgSvg;return withRot(false,()=>{let g='';const ic=['🐘','🦒','🐧','🐼','🦁','🍿','🌳','🐒','🦩','🐢'];let n=0;
  for(let r=-9;r<=9;r++)for(let q=-14;q<=14;q++){const[x,y]=px(q,r),h=Math.abs(Math.sin(q*12.9898+r*78.233)*43758.5)%1;
    const cls=h<.05?'w':h<.09?'s':h<.12?'f':h<.15?'d':((q-r)%2?'a':'');g+=`<polygon class="tb ${cls} ${h>.97?'blink':''}" points="${hexPts(x,y,SZ*.9)}"/>`;
    if(h>.15&&h<.185)g+=`<text x="${x}" y="${y}">${ic[n++%ic.length]}</text>`}
  return titleBgSvg=`<svg viewBox="-220 -140 440 280" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${g}</svg>`})}
function slotHtml(i){const sl=META.slots[i],a=screenArg;
  if(a.edit===i)return`<div class="slot"><h3>${sl?'Umbenennen':'Neuer Zoo'}</h3><input id="slotName" maxlength="16" placeholder="Name deines Zoos" value="${esc(sl?sl.name:'')}"><div class="acts"><button class="btn main" data-sv="${i}">${sl?'Speichern':'Anlegen'}</button><button class="btn sub" data-cancel="1">Abbrechen</button></div></div>`;
  if(!sl)return`<div class="slot empty"><h3>Speicherplatz ${i+1}</h3><div class="meta2">Noch leer</div><button class="btn main" data-new="${i}">＋ Neuer Zoo</button></div>`;
  if(a.del===i)return`<div class="slot"><h3>${esc(sl.name)} löschen?</h3><div class="meta2">Laufendes Spiel und ${perkCount(sl)} Verbesserungen gehen verloren. Highscores bleiben erhalten.</div><div class="acts"><button class="btn main" data-delyes="${i}" style="background:var(--bad);color:#fff">Ja, löschen</button><button class="btn sub" data-cancel="1">Abbrechen</button></div></div>`;
  if(a.fresh===i)return`<div class="slot"><h3>Neues Spiel?</h3><div class="meta2">Das laufende Spiel (${gameStatus(sl.game)}) wird beendet und zählt nicht für Highscore und Belohnung.</div><div class="acts"><button class="btn main" data-freshyes="${i}">Ja, neues Spiel</button><button class="btn sub" data-cancel="1">Abbrechen</button></div></div>`;
  return`<div class="slot ${META.lastSlot===i?'last':''}"><h3>🦁 ${esc(sl.name)}</h3>
    <div class="meta2"><span><b>${gameStatus(sl.game)}</b></span><span>Zuletzt: ${fago(sl.last)}</span><span>🏅 ${perkCount(sl)} Verbesserungen</span><span>${sl.games||0} Spiele</span></div>
    <div class="acts">${sl.game?`<button class="btn main" data-cont="${i}">▶ Weiterspielen</button><button class="btn sub" data-fresh="${i}">Neues Spiel</button>`:`<button class="btn main" data-play="${i}">Neues Spiel</button>`}
    <button class="btn sub" data-ren="${i}" aria-label="Umbenennen">✎</button><button class="btn sub" data-del="${i}" aria-label="Löschen">🗑</button></div></div>`}
function scoresHtml(){const f=screenArg.f||'all',list=META.scores.filter(x=>f==='all'||x.map===f).slice(0,10);
  const chips=`<div class="chips">${[['all','Alle']].concat(Object.keys(MAPS).map(k=>[k,MAPS[k].icon+' '+MAPS[k].name])).map(([k,l])=>`<button class="chip2 ${f===k?'on':''}" data-f="${k}">${l}</button>`).join('')}</div>`;
  const rows=list.map((x,i)=>`<tr class="${x.date===screenArg.hl?'hl':''}"><td class="rk">${i+1}.</td><td><b>${esc(x.name)}</b><span class="sub2">${fdate(x.date)}</span></td><td>${MAPS[x.map]?MAPS[x.map].icon+' '+MAPS[x.map].name:''}<span class="sub2">${x.won?'🏆 ganzes Jahr geschafft':SEAS_ICON[x.season]+' im '+SEASONS[x.season].name+' gescheitert'}</span></td><td class="pts">${fmt(x.pts)}</td></tr>`).join('');
  return`<div class="bar2"><h2>🏆 Highscores</h2><button class="btn sub" data-go="${screenArg.back||'title'}">Zurück</button></div>${chips}
    <div class="tablewrap">${list.length?`<table class="hs"><thead><tr><th></th><th>Zoo</th><th>Gelände</th><th class="pts">Punkte</th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty-note">Noch keine Einträge${f!=='all'?' für dieses Gelände':''}. Beende ein Spiel, um in die Liste zu kommen.</div>`}</div>`}
function glossCards(){const q=(screenArg.q||'').toLowerCase(),f=screenArg.gf||'all',tab=screenArg.tab||'cards';
  if(tab==='progs'){const all=[...Object.values(PROGS).map(p=>({...p,typ:'Förderprogramm · dauerhaft'})),...Object.values(ADS).map(p=>({...p,typ:'Werbung · nächste Saison'}))].filter(p=>!q||(p.name+p.text).toLowerCase().includes(q));
    return all.map(p=>`<div class="gcard"><span class="gb" style="background:var(--gold)"></span><div class="gh"><span class="ic">${p.icon}</span><span class="nm">${p.name}</span></div><div class="gm"><span>${p.typ}</span><span>ab 🪙 ${p.price}</span></div><div class="tx">${p.text}</div></div>`).join('')||'<div class="empty-note">Nichts gefunden.</div>'}
  const ord={gehege:0,attr:1,essen:2,schutz:3},ho={wasser:0,savanne:1,wald:2,wueste:3};
  const ks=Object.keys(CARDS).filter(k=>{const c=CARDS[k];if(f!=='all'&&(f.startsWith('h:')?c.hab!==f.slice(2):c.cat!==f))return false;return!q||(c.name+' '+c.text).toLowerCase().includes(q)})
    .sort((a,b)=>{const A=CARDS[a],B=CARDS[b];return ord[A.cat]-ord[B.cat]||(ho[A.hab]??9)-(ho[B.hab]??9)||A.name.localeCompare(B.name,'de')});
  return ks.map(k=>{const c=CARDS[k],pk=PERKS[k]||{};return`<div class="gcard"><span class="gb" style="background:${colOf(c)}"></span><div class="gh"><span class="ic">${c.icon}</span><span class="nm">${c.name}</span>${miniShape(k)}</div>
    <div class="gm"><span>${c.hab?habBadge(c.hab)+' '+HAB[c.hab].label+'-Gehege':CAT[c.cat].label}</span><span class="a">${c.a} A${pk.a?` (+${pk.a})`:''}</span><span class="s">${c.s} S${pk.s?` (+${pk.s})`:''}</span><span>${costOf(k)} BP</span><span>${c.rar==='winter'?'nur im Winter':c.rar}</span>${c.tags.includes('bedroht')?'<span class="rlt">● Rote Liste</span>':''}${c.tags.includes('einmalig')?'<span>Einmalig</span>':''}${perkN(k)?`<span class="md">🏅 ${perkN(k)}/${MAXPERK}</span>`:''}</div>
    <div class="tx">${c.text}</div></div>`}).join('')||'<div class="empty-note">Keine Karte gefunden.</div>'}
function glossHtml(){const tab=screenArg.tab||'cards',f=screenArg.gf||'all',sl=META.slots[META.lastSlot];
  const fl=[['all','Alle'],['h:wasser','Wasser'],['h:savanne','Savanne'],['h:wald','Wald'],['h:wueste','Wüste'],['attr','Attraktionen'],['essen','Essen'],['schutz','Artenschutz']];
  return`<div class="bar2"><h2>📚 Glossar</h2><button class="btn sub" data-go="${screenArg.back||'title'}">Zurück</button></div>
    <div class="chips"><button class="chip2 ${tab==='cards'?'on':''}" data-tab="cards">Karten (${Object.keys(CARDS).length})</button><button class="chip2 ${tab==='progs'?'on':''}" data-tab="progs">Förderprogramme &amp; Werbung (${Object.keys(PROGS).length+Object.keys(ADS).length})</button></div>
    ${tab==='cards'?`<div class="chips">${fl.map(([k,l])=>`<button class="chip2 ${f===k?'on':''}" data-gf="${k}">${l}</button>`).join('')}</div>`:''}
    <input type="search" id="gq" placeholder="Suchen, z.B. Panda oder Essensstand" value="${esc(screenArg.q||'')}">
    ${sl&&tab==='cards'?`<div class="meta2" style="color:var(--muted);font-size:13px">Werte inklusive Verbesserungen von <b style="color:var(--text)">${esc(sl.name)}</b>.</div>`:''}
    <div class="glist" id="glist">${glossCards()}</div>`}
const PERKCATS=[['gehege','Gehege','Tiere und ihre Lebensräume'],['attr','Attraktionen','Shows, Türme und Spielplätze'],['essen','Essen','Stände und Restaurants'],['schutz','Artenschutz','Grünflächen, Forschung, Zucht']];
const perkable=cat=>Object.keys(CARDS).filter(k=>CARDS[k].cat===cat&&perkN(k)<MAXPERK&&CARDS[k].rar!=='winter');
function perkHtml(){const a=screenArg,sl=activeSlot();
  if(a.step==='done'){const c=CARDS[a.key];return`<h2>Verbessert!</h2><div class="pcard"><span class="ic">${c.icon}</span><div class="info2"><span class="nm">${c.name}</span><span class="vals2"><span class="a">${c.a} A</span> · <span class="s">${c.s} S</span> · 🏅 ${perkN(a.key)}/${MAXPERK}</span><span class="tx">Gilt ab sofort in allen Spielen von ${esc(sl?sl.name:'')}.</span></div></div><button class="btn main big" data-go="scores">Zu den Highscores</button>`}
  if(a.step==='pick'){const list=a.cards.map(k=>{const c=CARDS[k];return`<div class="pcard"><span class="ic">${c.icon}</span><div class="info2"><span class="nm">${c.name} ${perkN(k)?`<small>🏅${perkN(k)}</small>`:''}</span><span class="vals2"><span class="a">${c.a} A</span> · <span class="s">${c.s} S</span> · ${costOf(k)} BP</span><span class="tx">${c.text}</span></div>
      <div class="pb"><button class="btn pa" data-perk="${k}|a">+1 A</button><button class="btn ps" data-perk="${k}|s">+1 S</button></div></div>`}).join('');
    return`<div class="bar2"><h2>Wähle eine Karte</h2><button class="btn sub" data-back2="1">Andere Kategorie</button></div><p style="margin:0;color:var(--muted)">Die Verbesserung gilt dauerhaft für ${esc(sl?sl.name:'diesen Zoo')}. Pro Karte bis zu ${MAXPERK}-mal.</p><div style="display:flex;flex-direction:column;gap:8px">${list}</div>`}
  return`<h2>🏅 Zoo-Verbesserung</h2><p style="margin:0">Spiel beendet. Wähle eine Kategorie, danach eine von 5 Karten, die du dauerhaft um +1 Attraktion oder +1 Artenschutz verbesserst.</p>
    <div class="perkgrid">${PERKCATS.map(([k,l,t])=>{const n=perkable(k).length;return`<button class="perkcat" data-pcat="${k}" ${n?'':'disabled'}><span class="nm">${l}</span><span class="tx">${t}</span><span class="tx">${n} Karten verbesserbar</span></button>`}).join('')}</div>
    <button class="btn sub" data-skipperk="1">Überspringen</button>`}
function renderScreen(){const root=$('screenRoot');root.classList.toggle('on',!!screen);if(!screen){root.innerHTML='';return}
  let h='';const last=META.lastSlot!=null?META.slots[META.lastSlot]:null;
  if(screen==='title')h=`<div class="scr"><div class="titlebg">${titleBg()}</div><div class="titlebox"><h1 class="logo">Zoodeck<span>Baue deinen Zoo, Karte für Karte</span></h1>
    ${last&&last.game?`<button class="btn main big" data-cont="${META.lastSlot}">▶ Weiterspielen<small>${esc(last.name)} · ${gameStatus(last.game)}</small></button>`:''}
    <button class="btn ${last&&last.game?'sub':'main'} big" data-go="slots">Spielen</button>
    <div class="trow"><button class="btn sub" data-go="scores">🏆 Highscores</button><button class="btn sub" data-go="gloss">📚 Glossar</button><button class="btn sub" id="sTut">📖 Tutorial</button></div>
    <button class="btn sub" id="sMute" style="align-self:center;padding:6px 14px">${Sfx.muted?'🔇 Ton aus':'🔊 Ton an'}</button></div></div>`;
  else if(screen==='slots')h=`<div class="scr"><div class="inner"><div class="bar2"><h2>Speicherplätze</h2><button class="btn sub" data-go="title">Zurück</button></div>${[0,1,2].map(slotHtml).join('')}</div></div>`;
  else if(screen==='scores')h=`<div class="scr"><div class="inner">${scoresHtml()}</div></div>`;
  else if(screen==='gloss')h=`<div class="scr"><div class="inner">${glossHtml()}</div></div>`;
  else if(screen==='perk')h=`<div class="scr"><div class="inner">${perkHtml()}</div></div>`;
  root.innerHTML=h;
  const ni=$('slotName');if(ni){ni.focus();ni.onkeydown=e=>{if(e.key==='Enter')root.querySelector('[data-sv]').click()}}
  const gq=$('gq');if(gq)gq.oninput=()=>{screenArg.q=gq.value;$('glist').innerHTML=glossCards()}}
$('screenRoot').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;Sfx.init();
  const sc=(n,arg={})=>{screen=n;screenArg=arg;Sfx.select();renderAll()};
  if(d.go){if(d.go==='gloss'&&META.lastSlot!=null&&META.slots[META.lastSlot])applyPerks(META.slots[META.lastSlot].perks);sc(d.go,{back:d.go==='scores'&&screen==='perk'?'title':'title',hl:screenArg.hl});return}
  if(d.cont!=null){Sfx.select();enterSlot(+d.cont);return}
  if(d.play!=null){Sfx.select();enterSlot(+d.play,true);return}
  if(d.fresh!=null){sc('slots',{fresh:+d.fresh});return}
  if(d.freshyes!=null){Sfx.select();enterSlot(+d.freshyes,true);return}
  if(d.new!=null){sc('slots',{edit:+d.new});return}
  if(d.ren!=null){sc('slots',{edit:+d.ren});return}
  if(d.del!=null){sc('slots',{del:+d.del});return}
  if(d.delyes!=null){const i=+d.delyes;META.slots[i]=null;if(META.lastSlot===i)META.lastSlot=null;if(META.active===i){META.active=null;state=null}saveMeta();sc('slots');return}
  if(d.cancel){sc(screen,{});return}
  if(d.sv!=null){const i=+d.sv,v=($('slotName').value||'').trim().slice(0,16)||`Zoo ${i+1}`;const sl=META.slots[i];
    if(sl){sl.name=v;saveMeta();sc('slots');return}
    META.slots[i]={name:v,created:Date.now(),last:Date.now(),game:null,perks:{},games:0};saveMeta();Sfx.select();enterSlot(i,true);return}
  if(d.f){screenArg.f=d.f;Sfx.select();renderScreen();return}
  if(d.tab){screenArg.tab=d.tab;screenArg.gf='all';Sfx.select();renderScreen();return}
  if(d.gf){screenArg.gf=d.gf;Sfx.select();renderScreen();return}
  if(d.pcat){const pool=shuffle(perkable(d.pcat)).slice(0,5);screenArg.step='pick';screenArg.cards=pool;Sfx.draw();renderScreen();return}
  if(d.back2){screenArg.step='cat';Sfx.select();renderScreen();return}
  if(d.skipperk){sc('scores',{hl:screenArg.hl});return}
  if(d.perk){const[k,w]=d.perk.split('|'),sl=activeSlot();if(!sl)return;sl.perks=sl.perks||{};const q=sl.perks[k]=sl.perks[k]||{};if(perkN(k)>=MAXPERK)return;q[w]=(q[w]||0)+1;applyPerks(sl.perks);saveMeta();Sfx.win();screenArg.step='done';screenArg.key=k;renderScreen();return}
  if(t.id==='sTut'){tutIdx=0;modal='tut';Sfx.select();renderModal();return}
  if(t.id==='sMute'){Sfx.muted=!Sfx.muted;try{localStorage.setItem('zoodeck-muted',Sfx.muted?'1':'0')}catch(e){}renderScreen();return}});
// Übergang in openMaps/chooseMap: Spiel landet im aktiven Speicherplatz
function start(data){loadMeta();if(data&&data.meta&&Array.isArray(data.meta.slots))META=data.meta;
  if(data&&data.state&&!META.slots.some(Boolean)){META.slots[0]={name:'Mein Zoo',created:Date.now(),last:Date.now(),game:data.state,perks:{},games:0};META.lastSlot=0}
  if(data&&data.resume!=null&&META.slots[data.resume]&&META.slots[data.resume].game){enterSlot(data.resume);return}
  screen='title';renderAll()}
window.claude?.hot?.snapshot?.(()=>{try{saveMeta()}catch(e){}return{meta:JSON.parse(JSON.stringify(META)),resume:screen?null:META.active}});
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
